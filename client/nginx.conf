server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Проверка живости контейнера, отдаётся самим nginx, до бэкенда не ходит
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api идёт на server:3000 с сохранением префикса /api в пути
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статические ресурсы сборки: имена файлов без хэша, поэтому кеш недолгий
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # index.html не кешируется, чтобы после деплоя всегда отдавался свежий
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Неизвестные SPA-маршруты идут на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
